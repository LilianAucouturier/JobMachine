name: Supabase Keep-Alive

on:
  schedule:
    # Exécuté tous les jours à 12:00 UTC (14:00 heure française)
    - cron: '0 12 * * *'
  workflow_dispatch: # Permet de lancer le ping manuellement depuis GitHub

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Ping Direct Supabase API
        run: |
          echo "=== PING DIRECT SUPABASE ==="
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X GET \
            "https://ibjwsbbulnnnugemqapj.supabase.co/rest/v1/jobs?select=id&limit=1" \
            -H "apikey: sb_publishable_zqlYtE12672f1JTEaJyONw_Z4lvu_Kx" \
            -H "Authorization: Bearer sb_publishable_zqlYtE12672f1JTEaJyONw_Z4lvu_Kx" || true)
          echo "Statut réponse Supabase : $HTTP_CODE"

      - name: Ping Vercel Serverless Endpoint
        run: |
          echo "=== PING VERCEL /api/ping ==="
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://job-machine-indol.vercel.app/api/ping" || true)
          echo "Statut réponse Vercel : $HTTP_CODE"

      - name: Prevent 60-day GitHub Actions auto-disable
        if: github.event_name == 'schedule'
        uses: liskin/gh-workflow-keepalive@v1
